<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сага билдирүү ✨</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Конфетти салюту үчүн -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fcfaf7;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #2b2b2b;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        /* Фондогу калкып жүргөн элементтер */
        .bg-element {
            position: absolute;
            color: rgba(212, 163, 154, 0.25);
            font-size: 20px;
            animation: float 9s infinite linear;
            bottom: -50px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        /* Ак түстөгү карточка */
        .card {
            background: #ffffff;
            padding: 55px 45px;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.03);
            text-align: center;
            max-width: 440px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .sparkle-icon {
            font-size: 32px;
            color: #c48b81;
            margin-bottom: 25px;
            display: inline-block;
        }

        .title-main {
            font-family: 'Playfair Display', serif;
            font-size: 1.85em;
            color: #2c2c2c;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .emoji-center {
            font-size: 1.8em;
            margin: 10px 0 18px 0;
            display: block;
        }

        .title-sub {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.6em;
            color: #c48b81;
            font-weight: 400;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .question-text {
            color: #8e8e8e;
            font-size: 0.92em;
            margin-bottom: 25px;
            font-weight: 400;
        }

        /* Баскычтар жайгашкан аймак */
        .btn-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            min-height: 60px;
            position: relative;
        }

        .btn-yes {
            background-color: #242424;
            color: #ffffff;
            padding: 13px 32px;
            font-size: 1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            z-index: 5;
        }

        .btn-yes:hover {
            background-color: #c48b81;
            transform: translateY(-2px);
        }

        /* "Жок" баскычы (качма) */
        .btn-no {
            background-color: #f1efed;
            color: #727272;
            padding: 13px 28px;
            font-size: 0.95em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 500;
            white-space: nowrap;
            z-index: 100;
            transition: transform 0.1s ease;
        }

        /* Соңку жооп тексти */
        .final-msg {
            display: none;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.4em;
            color: #c48b81;
            margin-top: 15px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="sparkle-icon">✦</div>
        
        <div class="title-main">
             Cага бир нерсе айтайынбы? 😅
        </div>
        
        <span class="emoji-center">😊</span>

        <div class="title-sub">
           
        </div>

        <div id="interactiveArea">
            <div class="question-text"></div>
            
            <div class="btn-wrapper">
                <button class="btn-yes" onclick="sayYes()">Ооба 🥰</button>
                <button class="btn-no" id="noBtn" onmouseover="moveNoButton()" ontouchstart="moveNoButton()" onclick="moveNoButton()">Жок 😜</button>
            </div>
        </div>

        <div class="final-msg" id="finalMsg">
            Чынын айтсам, сен мага жагасың
😊
        </div>
    </div>

    <script>
        // "Жок" баскычын экрандын каалаган жерине качыруу
        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            
            // Баскычты абсолюттук режимге өткөрөбүз
            noBtn.style.position = 'fixed';
            
            const padding = 30;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
            
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // "Ооба" басылганда
        function sayYes() {
            document.getElementById('interactiveArea').style.display = 'none';
            document.getElementById('finalMsg').style.display = 'block';
            
            const noBtn = document.getElementById('noBtn');
            if (noBtn) noBtn.style.display = 'none';

            // Конфетти салюту
            var duration = 2.5 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#c48b81', '#242424', '#e6ccb2']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#c48b81', '#242424', '#e6ccb2']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            })();
        }

        // Фондогу калкып жүрүүчү элементтер
        function createElements() {
            const symbols = ['✦', '•', '⋆', '♡'];
            for (let i = 0; i < 16; i++) {
                const el = document.createElement('div');
                el.classList.add('bg-element');
                el.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = (Math.random() * 5 + 6) + 's';
                el.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(el);
            }
        }

        createElements();
    </script>
</body>
</html>
